<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add New License</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #dfe9ea;
      color: #222;
    }

    .page-overlay {
      min-height: 100vh;
      padding: 40px 20px;
      background: rgba(218, 232, 234, 0.88);
    }

    .license-modal {
      width: 720px;
      max-width: 100%;
      margin: 0 auto;
      padding: 42px 55px 32px;
      background: #fff;
      border-radius: 5px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 28px;
      text-align: center;
      font-size: 22px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 9px;
    }

    .form-row label {
      text-align: right;
      font-size: 12px;
      font-weight: 700;
    }

    .required::after {
      content: "*";
      margin-left: 2px;
    }

    input {
      width: 100%;
      height: 32px;
      border: 0;
      border-radius: 4px;
      padding: 0 12px;
      background: #eef2f2;
      color: #555;
      outline: none;
      font-size: 12px;
    }

    input:focus {
      outline: 2px solid #9cc8cb;
    }

    .user-counts {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin: 14px 0 14px 142px;
    }

    .count-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-field label {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .count-field input {
      width: 68px;
    }

    .section {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 12px;
      margin-top: 17px;
    }

    .section-title {
      text-align: right;
      font-size: 12px;
      font-weight: 700;
      padding-top: 2px;
    }

    .section-title::before {
      content: "▲";
      color: #72b9bd;
      font-size: 7px;
      margin-right: 5px;
    }

    .tree {
      font-size: 11px;
      line-height: 1.65;
    }

    .tree-item {
      display: flex;
      align-items: flex-start;
      min-height: 22px;
    }

    .tree-item input[type="checkbox"] {
      width: 14px;
      height: 14px;
      margin: 2px 7px 0 0;
      accent-color: #6daeb3;
      flex: 0 0 auto;
    }

    .tree-children {
      position: relative;
      margin-left: 8px;
      padding-left: 20px;
    }

    .tree-children::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 0;
      bottom: 8px;
      border-left: 1px solid #d6e0e1;
    }

    .tree-children .tree-item {
      position: relative;
    }

    .tree-children .tree-item::before {
      content: "";
      position: absolute;
      left: -15px;
      top: 10px;
      width: 11px;
      border-top: 1px solid #d6e0e1;
    }

    .caret {
      color: #72b9bd;
      font-size: 8px;
      margin-left: 4px;
    }

    .bottom-row {
      display: grid;
      grid-template-columns: 130px 1fr 90px 1fr;
      gap: 12px;
      align-items: center;
      margin-top: 20px;
    }

    .bottom-row label {
      text-align: right;
      font-size: 12px;
      font-weight: 700;
    }

    .actions {
      text-align: center;
      margin-top: 22px;
    }

    .add-button {
      min-width: 135px;
      height: 34px;
      border: 0;
      border-radius: 5px;
      background: #9ebfc2;
      color: white;
      font-size: 12px;
      cursor: pointer;
    }

    .add-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      min-height: 18px;
    }

    .status.success {
      color: #26734d;
    }

    .status.error {
      color: #b42318;
    }

    @media (max-width: 760px) {
      .license-modal {
        padding: 35px 20px;
      }

      .form-row,
      .section {
        grid-template-columns: 1fr;
      }

      .form-row label,
      .section-title {
        text-align: left;
      }

      .user-counts {
        margin-left: 0;
        grid-template-columns: 1fr;
      }

      .bottom-row {
        grid-template-columns: 1fr;
      }

      .bottom-row label {
        text-align: left;
      }
    }
  </style>
</head>

<body>

<div class="page-overlay">

  <form class="license-modal" id="licenseForm">

    <h1>Add new license</h1>

    <div class="form-row">
      <label class="required" for="company">Company</label>
      <input
        id="company"
        type="text"
        placeholder="Enter company name"
        required
      />
    </div>

    <div class="user-counts">

      <div class="count-field">
        <label for="administrators">Administrators*</label>
        <input id="administrators" type="number" value="1" min="0" required />
      </div>

      <div class="count-field">
        <label for="teachers">Teachers*</label>
        <input id="teachers" type="number" value="1" min="0" required />
      </div>

      <div class="count-field">
        <label for="students">Students*</label>
        <input id="students" type="number" value="0" min="0" required />
      </div>

    </div>

    <div class="form-row">
      <label class="required" for="usage">
        Usage time per user<br>(hrs)
      </label>

      <input
        id="usage"
        type="number"
        min="0"
        placeholder="Enter expected usage time per user"
        required
      />
    </div>

    <div class="form-row">
      <label class="required" for="concurrency">Concurrency</label>

      <input
        id="concurrency"
        type="number"
        min="0"
        placeholder="Enter maximal count of Organisms for simultaneous use"
        required

    </div>

          </label>

        </label>

        <label class="tree-item">

        <label class="tree-item">

        <label class="tree-item">

        </label>

        <label class="tree-item">

        </label>

        <label class="tree-item">

        </label>

        <div class="tree-item">
          <input type="checkbox" data-section="Scenarios" data-label="Default Scenarios" />
          <span>Default Scenarios <span class="caret">▲</span></span>
        </div>

        <div class="tree-children">

            <input type="checkbox" data-section="Scenarios" data-label="Hemothorax (7836)" />

          </label>

          <label class="tree-item">

              type="checkbox"
              data-section="Scenarios"

            />

          </label>

          <label class="tree-item">

          </label>

    <!-- LEARNING MODULE -->

          />

        </label>

    <!-- DATES -->

      <label class="required" for="startDate">
        Start Date

        type="date"
        required
      />

      <label class="required" for="finishDate">
        Finish Date
      </label>

        id="finishDate"
        type="date"
        required
      />

    <div class="actions">

      <button
        id="addButton"
        class="add-button"
        type="submit"

        Add
      </button>

      <div
        id="status"
        class="status"
        aria-live="polite"
      ></div>

    </div>

  </form>

</div>


<script>

  const form = document.getElementById("licenseForm");
  const button = document.getElementById("addButton");
  const status = document.getElementById("status");


  form.addEventListener("submit", async function (event) {

    event.preventDefault();

    status.textContent = "";
    status.className = "status";


    const startDate = document.getElementById("startDate").value;
    const finishDate = document.getElementById("finishDate").value;


    if (finishDate < startDate) {

      status.textContent =
        "Finish Date must be after Start Date.";

      status.className = "status error";

      return;

    }


    const selectedOptions = [];


    document
      .querySelectorAll('input[type="checkbox"][data-label]:checked')
      .forEach(function (checkbox) {

        selectedOptions.push({

          section: checkbox.dataset.section,
          label: checkbox.dataset.label

        });

      });


    const submission = {

      company:
        document.getElementById("company").value.trim(),

      administrators:
        Number(document.getElementById("administrators").value),

      teachers:
        Number(document.getElementById("teachers").value),

      students:
        Number(document.getElementById("students").value),

      usage:
        Number(document.getElementById("usage").value),

      concurrency:
        Number(document.getElementById("concurrency").value),

      startDate:
        startDate,

      finishDate:
        finishDate,

      selectedOptions:
        selectedOptions

    };


    button.disabled = true;

    button.textContent = "Sending...";

    status.textContent =
      "Creating license request...";


    try {

      const response = await fetch("/api/submit", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(submission)

      });


      const result = await response.json();


      if (!response.ok) {

        throw new Error(
          result.error || "Submission failed."
        );

      }


      status.textContent =
        "License request submitted successfully.";

      status.className =
        "status success";


      form.reset();


      document.getElementById("administrators").value = 1;

      document.getElementById("teachers").value = 1;

      document.getElementById("students").value = 0;


    } catch (error) {

      console.error(error);

      status.textContent =
        "Unable to submit yet. Please try again.";

      status.className =
        "status error";

    } finally {

      button.disabled = false;

      button.textContent = "Add";

    }

  });

</script>

</body>
</html>
